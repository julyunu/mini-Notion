<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pastel Sage Green Planner & Clock Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #f1f6f1; /* Nền xanh lá pastel dịu dàng */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      text-align: center;
      padding: 24px 16px 18px;
      color: #3f5745;
    }

    .widget {
      max-width: 560px;
      width: 100%;
    }

    .greeting {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.15;
      color: #5c7a63;
      margin-bottom: 3px;
    }

    .clock {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 50px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #3f5745;
      line-height: 0.98;
      margin-bottom: 5px;
    }

    .date {
      font-family: 'Lora', Georgia, serif;
      font-size: 15px;
      letter-spacing: 0.04em;
      line-height: 1.15;
      color: #6a8771;
      text-transform: lowercase;
    }

    .divider {
      width: 44px;
      height: 1px;
      background-color: #c5d9c8;
      margin: 10px auto;
      border: none;
    }

    .quote-en {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: #496650;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .quote-vi {
      font-family: 'Lora', Georgia, serif;
      font-size: 12.5px;
      color: #68856f;
      line-height: 1.35;
      margin-bottom: 14px;
    }

    .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-solid {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #5c7a63;
      color: #f7fbf7;
      text-decoration: none;
      padding: 7px 15px;
      border-radius: 999px;
      font-family: 'Lora', Georgia, serif;
      font-size: 13.5px;
      line-height: 1.1;
      transition: opacity 0.2s ease;
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #bfd4c3;
      color: #4e6b55;
      text-decoration: none;
      padding: 7px 15px;
      border-radius: 999px;
      font-family: 'Lora', Georgia, serif;
      font-size: 13.5px;
      line-height: 1.1;
      background: transparent;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn-solid:hover,
    .btn-outline:hover {
      opacity: 0.82;
    }
  </style>
</head>
<body>
  <main class="widget">
    <div class="greeting" id="greeting">good morning · beautiful </div>
    <div class="clock" id="clock">11:00 am</div>
    <div class="date" id="date">thursday, november 19</div>
    <hr class="divider" />
    <p class="quote-en" id="quote-en">“Small steps every day quietly build the future you're dreaming of.”</p>
    <p class="quote-vi" id="quote-vi">Những bước nhỏ mỗi ngày đang âm thầm xây nên tương lai mà bạn hằng mơ ước.</p>

    <div class="actions">
      <a class="btn-solid" href="www.notion.so/p/Social-Media-Content-Planner-41a8197b1d2180ad9c71cb81eb0b5ff3?source=copy_link#6928197b1d21826dba1081d1ff03d32f" target="_blank" rel="noopener noreferrer">✦ Open planner · Lập kế hoạch →</a>
      <a class="btn-outline" href="www.notion.so/p/My-heart-My-soul-0468197b1d218380b83181fbdc95baf9?source=copy_link#bbe8197b1d21831c8eb581ee8efebc66" target="_blank" rel="noopener noreferrer">• Daily mood · Tâm trạng hôm nay →</a>
      <button class="btn-outline" type="button" onclick="randomQuote()" title="Đổi ngẫu nhiên câu khác">↻</button>
</div>
  </main>

  <script>
    // Kho 100 cặp câu tích cực, hướng về phía trước (Anh - Việt)

      { en: "“Small steps every day quietly build the future you're dreaming of.”", vi: "Những bước nhỏ mỗi ngày đang âm thầm xây nên tương lai mà bạn hằng mơ ước." },
      { en: "“Every new morning is a fresh canvas waiting for your gentle strokes.”", vi: "Mỗi buổi sáng thức dậy là một khung tranh mới đang chờ những nét vẽ dịu dàng của bạn." },
      { en: "“Trust the timing of your growth—seeds bloom when they are ready.”", vi: "Hãy tin vào nhịp độ trưởng thành của chính mình—hạt mầm sẽ nở hoa khi đủ nắng gió." },
      { en: "“Focus on progress, not perfection; forward is forward.”", vi: "Tập trung vào sự tiến bộ chứ không phải sự hoàn hảo; chỉ cần tiến về phía trước là đủ." },
      { en: "“Good things are quietly making their way toward you.”", vi: "Những điều tốt đẹp đang lặng lẽ tìm đường bước tới bên bạn." },

      { en: "“Begin where you are, use what you have, and take one calm step.”", vi: "Bắt đầu từ nơi bạn đang đứng, dùng những gì bạn có và bước một bước thật bình tâm." },
      { en: "“A fresh chapter starts the moment you decide to try again.”", vi: "Một chương mới luôn bắt đầu ngay khoảnh khắc bạn quyết định thử lại lần nữa." },
      { en: "“Keep watering your dreams; even invisible roots are growing stronger.”", vi: "Cứ tiếp tục tưới tắm cho ước mơ của bạn; ngay cả những chiếc rễ dưới đất cũng đang lớn dần." },
      { en: "“Today holds possibilities you haven't even imagined yet.”", vi: "Ngày hôm nay ẩn chứa những cơ hội tuyệt vời mà có thể bạn chưa từng nghĩ tới." },
      { en: "“Discipline is simply choosing what you want most over what you want right now.”", vi: "Kỷ luật chỉ đơn giản là chọn điều bạn mong muốn nhất thay vì sự thoải mái nhất thời." },
      { en: "“Look how far you've come from the things you once thought you couldn't do.”", vi: "Hãy nhìn xem bạn đã đi xa tới nhường nào so với những điều từng nghĩ mình không làm nổi." },
      { en: "“One focused hour today can change the whole rhythm of your week.”", vi: "Một giờ tập trung trọn vẹn hôm nay có thể đổi mới nhịp điệu của cả tuần lễ." },
      { en: "“You are capable of creating a life that feels as good as it looks.”", vi: "Bạn hoàn toàn đủ khả năng kiến tạo một cuộc sống vừa đẹp đẽ vừa bình yên từ bên trong." },
      { en: "“Let curiosity lead you forward instead of fear holding you back.”", vi: "Hãy để sự tò mò dẫn lối bạn tiến lên thay vì để nỗi sợ níu chân lại." },

      { en: "“Clear your mind, pick one priority, and move with steady grace.”", vi: "Dọn gọn tâm trí, chọn một ưu tiên quan trọng nhất và bước đi thật vững vàng." },
      { en: "“The best days of your life are still waiting ahead of you.”", vi: "Những ngày rực rỡ nhất của cuộc đời bạn vẫn đang chờ ở phía trước." },
      { en: "“Consistency beats intensity—show up gently every single day.”", vi: "Sự đều đặn luôn thắng sự bùng nổ nhất thời—hãy kiên trì hiện diện mỗi ngày." },

      { en: "“You have everything within you to make today meaningful.”", vi: "Bạn có sẵn mọi nội lực bên trong để biến ngày hôm nay trở nên thật ý nghĩa." },
      { en: "“Don't rush the process; lasting things are built slowly and thoughtfully.”", vi: "Đừng vội vàng đốt cháy giai đoạn; những điều bền vững luôn được xây thật chậm và kỹ." },
      { en: "“A year from now, you'll be so glad you didn't give up today.”", vi: "Một năm nữa nhìn lại, bạn sẽ thấy thật may mắn vì hôm nay mình đã không bỏ cuộc." },
      { en: "“Keep your eyes on the horizon and your heart grounded in the present.”", vi: "Hướng ánh nhìn về phía chân trời nhưng giữ trái tim vững vàng ở phút giây hiện tại." },
      { en: "“Small daily habits are the quiet architecture of a beautiful life.”", vi: "Những thói quen nhỏ hằng ngày chính là kiến trúc thầm lặng của một cuộc đời đẹp." },
      { en: "“Step forward with quiet confidence—you are more prepared than you think.”", vi: "Bước tới với sự tự tin điềm tĩnh—bạn đã sẵn sàng hơn bạn nghĩ rất nhiều." },
      { en: "“Each sunrise brings new strength, new clarity, and new hope.”", vi: "Mỗi bình minh lên đều mang theo nguồn sức mạnh mới, sự sáng suốt mới và hy vọng mới." },
      { en: "“Create plans that excite your soul, not just fill your calendar.”", vi: "Lập những kế hoạch khiến tâm hồn bạn háo hức, chứ không chỉ để lấp đầy cuốn lịch." },
      { en: "“Growth happens in the quiet choices you make when nobody is watching.”", vi: "Sự trưởng thành diễn ra trong những lựa chọn thầm lặng khi chẳng có ai dõi theo." },
      { en: "“Stay open to pleasant surprises—life loves rewarding hopeful hearts.”", vi: "Luôn rộng lòng đón nhận những bất ngờ dễ thương—cuộc sống luôn ưu ái trái tim giàu hy vọng." },
      { en: "“You don't need to see the whole staircase to take the first step.”", vi: "Bạn không cần nhìn thấy trọn vẹn cả cầu thang mới dám bước lên bậc đầu tiên." },
      { en: "“Channel your energy into what you can build, learn, and improve today.”", vi: "Dồn năng lượng vào những gì bạn có thể xây dựng, học hỏi và cải thiện ngay hôm nay." },
      { en: "“Your potential is endless when you move at a sustainable, joyful pace.”", vi: "Tiềm năng của bạn là vô hạn khi bạn bước đi với nhịp độ bền bỉ và đầy niềm vui." },
      { en: "“Leave yesterday behind; today is eager to meet your best energy.”", vi: "Khép ngày hôm qua lại phía sau; hôm nay đang háo hức đón nguồn năng lượng đẹp nhất của bạn." },
      { en: "“Dream big, plan simply, and act with kindness.”", vi: "Mơ ước thật lớn, lên kế hoạch thật giản đơn và hành động bằng sự tử tế." },
      { en: "“Every skill you admire in others started as a beginner's first try.”", vi: "Mọi kỹ năng bạn ngưỡng mộ ở người khác đều từng bắt đầu từ lần thử đầu tiên vụng về." },
      { en: "“Keep moving forward—even a slow tide still reaches the shore.”", vi: "Cứ tiếp tục tiến về phía trước—ngay cả con sóng chậm rãi rồi cũng sẽ chạm tới bờ." },
      { en: "“Design your days around what truly matters to your heart.”", vi: "Thiết kế từng ngày của bạn xoay quanh những điều thực sự quan trọng với trái tim." },
      { en: "“Success is built on quiet mornings, clear intentions, and steady follow-through.”", vi: "Thành công được dệt nên từ những buổi sáng tĩnh tại, ý định rõ ràng và sự kiên trì." },
      { en: "“Believe in the person you are becoming.”", vi: "Hãy tin tưởng vào phiên bản tuyệt vời mà bạn đang từng ngày trở thành." },
      { en: "“What you practice every day becomes who you are.”", vi: "Những gì bạn rèn luyện mỗi ngày sẽ dần định hình nên con người bạn." },
      { en: "“There is magic in starting fresh with a clear plan and a calm heart.”", vi: "Luôn có phép màu trong việc bắt đầu lại với một kế hoạch rõ ràng và trái tim bình thản." },

      { en: "“Your goals are closer than they were yesterday—keep going.”", vi: "Mục tiêu của bạn đã ở gần hơn ngày hôm qua một chút rồi—cứ bước tiếp nhé." },
      { en: "“Plant seeds of effort today and trust the harvest ahead.”", vi: "Gieo những hạt giống nỗ lực hôm nay và tin vào mùa gặt rực rỡ phía trước." },
      { en: "“Clarity comes from action, not from overthinking.”", vi: "Sự sáng tỏ đến từ hành động thực tế, chứ không đến từ việc suy nghĩ quá nhiều." },
      { en: "“Make today a day your future self looks back on with a proud smile.”", vi: "Biến hôm nay thành một ngày mà phiên bản tương lai của bạn nhìn lại với nụ cười tự hào." },
      { en: "“Stay patient, stay hopeful, and keep tending to your path.”", vi: "Giữ lòng kiên nhẫn, giữ niềm hy vọng và tiếp tục chăm chút cho con đường của riêng mình." },

      { en: "“Keep your promises to yourself—that is where self-trust blooms.”", vi: "Giữ trọn những lời hứa với chính mình—đó là nơi niềm tin vào bản thân đơm hoa." },

      { en: "“A clear plan turns overwhelming dreams into doable daily steps.”", vi: "Một kế hoạch rõ ràng sẽ biến những ước mơ lớn lao thành từng bước nhỏ dễ thực hiện." },
      { en: "“You are stronger, wiser, and more resilient than you realize.”", vi: "Bạn mạnh mẽ, sáng suốt và kiên cường hơn những gì bạn vẫn tự nhận thấy." },
      { en: "“Let today be a stepping stone toward a calmer, brighter tomorrow.”", vi: "Hãy để hôm nay làm bậc thềm đưa bạn tới một ngày mai bình yên và tươi sáng hơn." },
      { en: "“Celebrate every small milestone on your way to bigger goals.”", vi: "Ăn mừng từng cột mốc nhỏ trên hành trình tiến tới những mục tiêu lớn hơn." },
      { en: "“Stay curious, stay kind, and keep moving toward what lights you up.”", vi: "Luôn giữ sự tò mò, giữ lòng tử tế và bước về phía những điều thắp sáng tâm hồn bạn." },
      { en: "“Good habits planted in spring become effortless shade in summer.”", vi: "Những thói quen tốt gieo từ mùa xuân sẽ trở thành bóng mát thảnh thơi vào mùa hạ." },
      { en: "“Your vision is valid—give it time, patience, and daily care.”", vi: "Ước mơ của bạn hoàn toàn xứng đáng—hãy dành cho nó thời gian, sự kiên nhẫn và chăm chút mỗi ngày." },
      { en: "“Start with clarity, work with calm, and finish with gratitude.”", vi: "Bắt đầu bằng sự rõ ràng, làm việc trong bình thản và khép lại bằng lòng biết ơn." },
      { en: "“Momentum is built one intentional morning at a time.”", vi: "Đà bứt phá được tạo nên từ từng buổi sáng sống có chủ đích." },
      { en: "“Look ahead with excitement—you are creating something wonderful.”", vi: "Nhìn về phía trước với sự háo hức—bạn đang tự tay tạo nên một điều thật tuyệt vời." },
      { en: "“When you align your actions with your values, everything feels lighter.”", vi: "Khi hành động đồng điệu với giá trị bạn trân trọng, mọi việc đều trở nên nhẹ nhàng." },
      { en: "“Give your best to today, and trust tomorrow to unfold beautifully.”", vi: "Dành trọn tâm huyết cho hôm nay, và tin rằng ngày mai sẽ mở ra thật rạng rỡ." },
      { en: "“Every day is a chance to refine your path and step closer to your goals.”", vi: "Mỗi ngày đều là một cơ hội để tinh chỉnh con đường và tiến gần hơn tới mục tiêu." },
      { en: "“Quiet focus today creates loud results tomorrow.”", vi: "Sự tập trung thầm lặng hôm nay sẽ tạo nên những kết quả rực rỡ ngày mai." },

      { en: "“Step forward bravely—the future favors those who keep trying.”", vi: "Bước tới thật can đảm—tương lai luôn mỉm cười với những người không ngừng cố gắng." },
      { en: "“Let each checked box remind you of how capable you truly are.”", vi: "Hãy để mỗi ô việc hoàn thành nhắc bạn nhớ rằng bạn tài giỏi đến nhường nào." },
      { en: "“A fresh start isn't a new year—it's a new mindset right now.”", vi: "Một khởi đầu mới không cần đợi tới năm mới—đó chính là tâm thế mới ngay lúc này." },
      { en: "“Keep tending your garden; your season of bloom is coming.”", vi: "Cứ chăm chỉ vun xới khu vườn của mình; mùa nở hoa của bạn đang tới gần rồi." },
      { en: "“Forward is a pace, no matter the speed. Keep going.”", vi: "Tiến về phía trước là một hành trình, bất kể tốc độ nhanh hay chậm. Cứ bước tiếp nhé." }
    ];

    let currentIndex = 0;

    function getDayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff = date - start;
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function renderQuote(index) {
      const item = forwardQuotes[index % forwardQuotes.length];
      document.getElementById("quote-en").textContent = item.en;
      document.getElementById("quote-vi").textContent = item.vi;
    }

    function randomQuote() {
      let next = Math.floor(Math.random() * forwardQuotes.length);
      if (next === currentIndex) {
        next = (currentIndex + 1) % forwardQuotes.length;
      }
      currentIndex = next;
      renderQuote(currentIndex);
    }

    function updateWidget() {
      const now = new Date();

      const hour = now.getHours();
      const period = hour < 12 ? "good morning" : hour < 18 ? "good afternoon" : "good evening";
      document.getElementById("greeting").textContent = `${period} · beautiful`;

      const ampm = hour >= 12 ? "pm" : "am";
      const displayHour = hour % 12 === 0 ? 12 : hour % 12;
      const minutes = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${displayHour}:${minutes} ${ampm}`;

      const days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
      const months = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
      document.getElementById("date").textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
    }

    currentIndex = getDayOfYear(new Date()) % forwardQuotes.length;
    renderQuote(currentIndex);
    updateWidget();
    setInterval(updateWidget, 1000);
  </script>
</body>
</html>
